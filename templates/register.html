<!DOCTYPE html>
<html>
<head>
    <title>User Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Poppins", sans-serif;
        }

        .register-card {
            width: 420px;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.7s ease-out;
            backdrop-filter: blur(5px);
        }

        h2 {
            font-weight: 700;
        }

        label {
            font-weight: 500;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .btn-register {
            height: 50px;
            border-radius: 30px;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn-register:hover {
            transform: scale(1.05);
        }

        a {
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>
<body>

<div class="register-card">

    <h2 class="text-center text-success mb-3">📝 Create Account</h2>

    {% if request.query_params.get("error") %}
        <div class="alert alert-danger mt-3">
            {{ request.query_params.get("error") }}
        </div>
    {% endif %}

    <form method="post" action="/register_user">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input name="name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" placeholder="Create a password" required>
        </div>

        <button class="btn btn-success w-100 btn-register">Register</button>
    </form>

    <p class="text-center mt-3">
        Already have an account?  
        <a href="/login" class="text-success">Login</a>
    </p>

</div>

</body>
</html>
