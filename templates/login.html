<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #864660, #43313e);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Poppins", sans-serif;
        }

        .login-card {
            width: 420px;
            background: rgba(213, 96, 96, 0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.7s ease-out;
            backdrop-filter: blur(5px);
        }

        h2 {
            font-weight: 700;
        }

        label {
            font-weight: 500;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .btn-login {
            height: 50px;
            border-radius: 30px;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: scale(1.05);
        }

        a {
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>
<body>

<div class="login-card">

    <h2 class="text-center text-primary mb-3">🔐 User Login</h2>

    {% if request.query_params.get("error") %}
        <div class="alert alert-danger mt-3">
            {{ request.query_params.get("error") }}
        </div>
    {% endif %}

    <form method="post" action="/login_user">

        <div class="mb-3">
            <label>Email</label>
            <input name="email" type="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input name="password" type="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button class="btn btn-primary w-100 btn-login">Login</button>
    </form>

    <p class="text-center mt-3">
        Don’t have an account?  
        <a href="/register" class="text-primary">Create an account</a>
    </p>

</div>

</body>
</html>
