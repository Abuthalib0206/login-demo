<!DOCTYPE html>
<html>
<head>
    <title>Home - FastAPI App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #9E402E, #6828038b);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Poppins", sans-serif;
        }

        .card-custom {
            border-radius: 20px;
            padding: 40px;
            background: #3f3838;
            width: 420px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        h2 {
            font-weight: 700;
        }

        .btn-custom {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="card-custom text-center">

    <h2 class="text-primary mb-3">⚡ FastAPI Web App</h2>
    <p class="text-secondary">Your secure and modern application</p>

    {% if request.query_params.get("msg") %}
        <div class="alert alert-success mt-3">
            {{ request.query_params.get("msg") }}
        </div>
    {% endif %}

    <div class="mt-4 d-grid gap-3">
        <a href="/login" class="btn btn-primary btn-custom">Login</a>
        <a href="/register" class="btn btn-success btn-custom">Register</a>
    </div>

</div>

</body>
</html>
