<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .card-box {
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            transition: .3s;
        }

        .card-box:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">FastAPI Dashboard</a>
    <a href="/" class="btn btn-outline-light">Logout</a>
</nav>

<div class="container mt-5">

    <h2 class="mb-3">Welcome, <span class="text-primary">{{ name }}</span> 👋</h2>
    <p class="text-muted">You have successfully logged in.</p>

    <div class="row mt-4">

        <div class="col-md-4 mb-3">
            <div class="card card-box">
                <h4 class="text-secondary">Profile</h4>
                <p>View your account details and update your info.</p>
                <a href="#" class="btn btn-primary btn-sm">Open</a>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card card-box">
                <h4 class="text-secondary">Settings</h4>
                <p>Manage your preferences and privacy settings.</p>
                <a href="#" class="btn btn-warning btn-sm">Open</a>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card card-box">
                <h4 class="text-secondary">Reports</h4>
                <p>View your activity logs and reports.</p>
                <a href="#" class="btn btn-success btn-sm">Open</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
